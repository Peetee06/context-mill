name: Build and Release MCP Resources

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check-version:
    name: Check for a new version to release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      is-new-version: ${{ steps.check.outputs.is-new-version }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Compare package.json's version to the tag of the latest PUBLISHED
      # (non-draft, non-prerelease) GitHub release. release-please only bumps
      # package.json (via its PR); it never creates a release. So a mismatch
      # here means "the release PR merged and we still owe the world a shipped
      # release for this version" — even on a workflow_dispatch retry after a
      # partially-failed run, this still evaluates true because the release
      # never got flipped out of draft.
      - name: Compare package.json to latest published release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r '.version' package.json)
          LATEST_PUBLISHED_TAG=$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.tag_name' 2>/dev/null || echo "v0.0.0")
          LATEST_PUBLISHED_VERSION=${LATEST_PUBLISHED_TAG#v}
          echo "package.json version: ${VERSION}"
          echo "latest published release: ${LATEST_PUBLISHED_TAG}"
          if [ "$VERSION" != "$LATEST_PUBLISHED_VERSION" ]; then
            echo "is-new-version=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-new-version=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

  build-and-release:
    name: Build, tag, upload assets, publish release
    needs: check-version
    if: needs.check-version.outputs.is-new-version == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.check-version.outputs.version }}
      RELEASE_TAG: ${{ needs.check-version.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 'lts/*'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install

      - name: Build skills
        env:
          BUILD_VERSION: ${{ env.RELEASE_VERSION }}
        run: pnpm run build

      - name: Scan skills with Warlock
        env:
          CONTEXT_MILL_WARLOCK_POSTHOG_PERSONAL_KEY: ${{ secrets.CONTEXT_MILL_WARLOCK_POSTHOG_PERSONAL_KEY }}
        run: node scripts/scan-warlock.js dist/skills

      - name: List build artifacts
        run: |
          echo "=== dist/ ==="
          ls -lh dist/
          echo "=== dist/skills/ ==="
          ls -lh dist/skills/

      # Extract the CHANGELOG.md section for this version. release-please's
      # release PR appended a "## [X.Y.Z] (date)" block at the top; slice from
      # that header up to (but not including) the next "## [" header.
      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v version="$RELEASE_VERSION" '
            /^## \[/ {
              if (in_section) exit
              if ($0 ~ "^## \\[" version "\\]") { in_section = 1; next }
            }
            in_section { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          echo "=== extracted release notes ==="
          cat /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "WARN: no CHANGELOG.md section found for v${RELEASE_VERSION}; falling back to a stub body"
            printf 'Automated release of PostHog integration resources for AI agents.\n\n**Version:** %s\n**SHA:** %s\n' "$RELEASE_VERSION" "$GITHUB_SHA" > /tmp/release-notes.md
          fi

      # Idempotent: if a draft release for RELEASE_TAG already exists (from a
      # previous partial run), reuse it. Otherwise create a fresh draft. Either
      # way, the tag is created if it doesn't yet exist — release-please stopped
      # doing that when we set skip-github-release, so build-release is the sole
      # tag writer for RELEASE_TAG.
      - name: Create or reuse draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists — reusing."
          else
            echo "Creating draft release $RELEASE_TAG at ${GITHUB_SHA}..."
            gh release create "$RELEASE_TAG" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "Release $RELEASE_TAG" \
              --notes-file /tmp/release-notes.md
          fi

      - name: Upload skills bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" ./dist/skills-mcp-resources.zip --clobber

      - name: Upload individual skill ZIPs and skill menu
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Upload each skill ZIP as a release asset
          for file in dist/skills/*.zip; do
            filename=$(basename "$file")
            echo "Uploading $filename..."
            gh release upload "$RELEASE_TAG" "$file" --clobber
          done
          # Upload skill-menu.json (used by the wizard to discover available skills)
          echo "Uploading skill-menu.json..."
          gh release upload "$RELEASE_TAG" dist/skills/skill-menu.json --clobber
          # Upload the orchestrator agent prompts + menu (flat asset names)
          gh release upload "$RELEASE_TAG" dist/agents/agent-menu.json dist/agents/agents-*.md --clobber
          # Upload each bundled group (one JSON of every variant, in place of per-variant ZIPs)
          for file in dist/skills/*.json; do
            filename=$(basename "$file")
            case "$filename" in manifest.json|skill-menu.json) continue ;; esac
            echo "Uploading $filename..."
            gh release upload "$RELEASE_TAG" "$file" --clobber
          done
          # Upload reference docs (used by the wizard for runtime-specific overrides)
          for file in dist/skills/*.md; do
            [ -f "$file" ] || continue
            filename=$(basename "$file")
            echo "Uploading $filename..."
            gh release upload "$RELEASE_TAG" "$file" --clobber
          done

      - name: Publish release
        # Every asset (bundle, skill ZIPs, skill-menu.json, docs) is now uploaded,
        # so flip the draft to published atomically. This is the point
        # `releases/latest` moves to the new version — the wizard never sees it
        # without skill-menu.json.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest

      - name: Update latest tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push -f origin latest

      - name: Generate skills repo token
        id: skills_token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.SKILLS_PUSH_APP_ID }}
          private-key: ${{ secrets.SKILLS_PUSH_APP_PRIVATE_KEY }}
          repositories: skills,ai-plugin

      - name: Push plugins to skills repo
        env:
          SKILLS_REPO_TOKEN: ${{ steps.skills_token.outputs.token }}
        run: |
          MANIFEST="dist/push-manifest.json"
          TARGET_REPO=$(jq -r '.target_repo' "$MANIFEST")
          WORK_DIR=$(mktemp -d)

          echo "Cloning $TARGET_REPO..."
          git clone "https://x-access-token:${SKILLS_REPO_TOKEN}@github.com/${TARGET_REPO}.git" "$WORK_DIR"

          # Read each plugin entry from the push manifest and sync to the destination
          jq -c '.plugins[]' "$MANIFEST" | while read -r entry; do
            NAME=$(echo "$entry" | jq -r '.name')
            SOURCE="dist/$(echo "$entry" | jq -r '.source')"
            DEST="$WORK_DIR/$(echo "$entry" | jq -r '.destination')"

            echo "  Syncing $NAME → $(echo "$entry" | jq -r '.destination')"

            # Clear destination (preserve README.md if present)
            if [ -d "$DEST" ]; then
              find "$DEST" -mindepth 1 -not -name 'README.md' -not -name '.' -exec rm -rf {} + 2>/dev/null || true
            fi
            mkdir -p "$DEST"

            # Copy plugin contents
            cp -r "$SOURCE"/. "$DEST"/
          done

          # Commit and push
          cd "$WORK_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to push"
          else
            git commit -m "Update generated plugins from context-mill v${RELEASE_VERSION}"
            git push
            echo "Pushed updated plugins to $TARGET_REPO"
          fi
          rm -rf "$WORK_DIR"

      - name: Push omnibus skills to ai-plugin repo
        env:
          SKILLS_REPO_TOKEN: ${{ steps.skills_token.outputs.token }}
        run: |
          WORK_DIR=$(mktemp -d)
          MEGA_SKILLS="dist/marketplace/plugins/posthog-all/skills"

          echo "Cloning PostHog/ai-plugin..."
          git clone "https://x-access-token:${SKILLS_REPO_TOKEN}@github.com/PostHog/ai-plugin.git" "$WORK_DIR"

          # Sync each omnibus skill, stripping the "omnibus-" prefix to match ai-plugin's layout
          for src in "$MEGA_SKILLS"/omnibus-*; do
            SKILL_NAME=$(basename "$src" | sed 's/^omnibus-//')
            DEST="$WORK_DIR/skills/$SKILL_NAME"

            echo "  Syncing $SKILL_NAME"
            rm -rf "$DEST/references" "$DEST/SKILL.md"
            mkdir -p "$DEST"
            cp -r "$src/references" "$DEST/"
            cp "$src/SKILL.md" "$DEST/"
          done

          cd "$WORK_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to push to PostHog/ai-plugin"
          else
            git commit -m "Update generated skills from context-mill v${RELEASE_VERSION}"
            git push
            echo "Pushed updated skills to PostHog/ai-plugin"
          fi
          rm -rf "$WORK_DIR"

      - name: Build Summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** $RELEASE_VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** $RELEASE_TAG" >> $GITHUB_STEP_SUMMARY
          echo "- **Bundle:** skills-mcp-resources.zip" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Skills Manifest" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat dist/skills/manifest.json | jq '{version, buildVersion, buildTimestamp, skillCount: (.skills | length)}' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Individual Skills" >> $GITHUB_STEP_SUMMARY
          ls -lh dist/skills/*.zip >> $GITHUB_STEP_SUMMARY

      - name: Notify Slack of release
        uses: slackapi/slack-github-action@485a9d42d3a73031f12ec201c457e2162c45d02d # v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_WIZARD_RELEASES }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":rocket: context-mill *<https://github.com/${{ github.repository }}/releases/tag/${{ env.RELEASE_TAG }}|${{ env.RELEASE_TAG }}>* released"
            }
